<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Fusion Star</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .chart-bar-wrap { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 20px; }
    .chart-bar { flex: 1; background: linear-gradient(to top, var(--primary), var(--accent)); border-radius: 6px 6px 0 0; min-height: 4px; transition: var(--transition); position: relative; }
    .chart-bar:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--bg-card2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: .75rem; white-space: nowrap; }
    .chart-labels { display: flex; gap: 8px; margin-top: 8px; }
    .chart-label { flex: 1; text-align: center; font-size: .7rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo gradient-text">✦ Fusion Star</div>
      <nav class="sidebar-nav">
        <a href="/admin/" class="sidebar-link active" id="sl-dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/admin/products.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Products
        </a>
        <a href="/admin/orders.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Orders
        </a>
        <a href="/" class="sidebar-link" style="margin-top:auto;margin-bottom:0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Store
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h2>Dashboard</h2>
          <p>Welcome back, Admin. Here's what's happening.</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="spinner" style="margin:0;width:24px;height:24px"></div></div>
      </div>

      <!-- Revenue Chart + Recent Orders -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px">
        <div class="card" style="padding:24px">
          <h3 style="margin-bottom:4px">Revenue (6 months)</h3>
          <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:12px">Monthly revenue trend</p>
          <div class="chart-bar-wrap" id="revenue-chart"></div>
          <div class="chart-labels" id="revenue-labels"></div>
        </div>
        <div class="card" style="padding:24px">
          <h3 style="margin-bottom:16px">Recent Orders</h3>
          <div id="recent-orders"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

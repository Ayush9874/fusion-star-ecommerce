<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products — Fusion Star Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo gradient-text">✦ Fusion Star</div>
      <nav class="sidebar-nav">
        <a href="/admin/" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/admin/products.html" class="sidebar-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Products
        </a>
        <a href="/admin/orders.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Orders
        </a>
        <a href="/" class="sidebar-link">← Back to Store</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h2>Products</h2>
          <p>Manage your store's product catalog</p>
        </div>
        <button class="btn btn-primary" onclick="openProductModal()">+ Add Product</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="table" id="products-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Rating</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <tr><td colspan="7"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add Product</h3>
        <button class="modal-close" onclick="closeProductModal()">×</button>
      </div>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" class="form-input" id="p-name" required />
        </div>
        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea class="form-textarea" id="p-desc" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Price (₹) *</label>
            <input type="number" class="form-input" id="p-price" step="0.01" min="0" required />
          </div>
          <div class="form-group">
            <label class="form-label">MSRP (Original Price ₹)</label>
            <input type="number" class="form-input" id="p-disc" step="0.01" min="0" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select class="form-select" id="p-cat" required>
              <option value="">Select category</option>
              <option>Electronics</option><option>Clothing</option><option>Books</option>
              <option>Home &amp; Kitchen</option><option>Sports</option><option>Beauty</option>
              <option>Toys</option><option>Automotive</option><option>Jewelry</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Stock *</label>
            <input type="number" class="form-input" id="p-stock" min="0" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Brand</label>
          <input type="text" class="form-input" id="p-brand" />
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input type="url" class="form-input" id="p-img" placeholder="https://..." />
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:12px">
          <input type="checkbox" id="p-featured" style="width:18px;height:18px;accent-color:var(--primary)" />
          <label class="form-label" for="p-featured" style="margin:0">Mark as Featured</label>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Save Product</button>
          <button type="button" class="btn btn-ghost" onclick="closeProductModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal" style="max-width:400px">
      <h3 style="margin-bottom:12px">Delete Product</h3>
      <p style="color:var(--text-muted);margin-bottom:24px">Are you sure you want to delete this product? This action cannot be undone.</p>
      <div style="display:flex;gap:12px">
        <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
        <button class="btn btn-ghost" onclick="document.getElementById('delete-modal').classList.remove('open')">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

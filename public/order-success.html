<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Fusion Star</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .success-container { text-align: center; padding: 80px 20px; max-width: 560px; margin: 0 auto; }
    .success-icon { font-size: 5rem; margin-bottom: 24px; }
    .success-container h1 { margin-bottom: 12px; font-size: 2rem; }
    .success-container p { color: var(--text-muted); margin-bottom: 32px; }
    .order-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; text-align: left; margin: 0 auto 32px; }
    .order-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .order-row:last-child { border-bottom: none; }
    .order-row span:first-child { color: var(--text-muted); }
    .success-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-logo">✦ Fusion Star</a>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      <div class="success-container">
        <div class="success-icon">🎉</div>
        <h1 class="gradient-text">Order Confirmed!</h1>
        <p>Thank you for your purchase. Your order is being processed and you'll receive updates soon.</p>
        <div class="order-card" id="order-info">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
        <div class="success-actions">
          <a href="/orders.html" class="btn btn-primary">View My Orders</a>
          <a href="/" class="btn btn-ghost">Continue Shopping</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const orderId = new URLSearchParams(window.location.search).get('order');
    async function loadOrder() {
      if (!orderId) { document.getElementById('order-info').innerHTML = '<p style="color:var(--text-muted)">No order ID provided.</p>'; return; }
      const data = await apiFetch(`/api/orders/${orderId}`);
      if (!data.success) { document.getElementById('order-info').innerHTML = '<p style="color:var(--danger)">Could not load order details.</p>'; return; }
      const o = data.order;
      document.getElementById('order-info').innerHTML = `
        <div class="order-row"><span>Order ID</span><span style="font-weight:700;font-size:.85rem">${o._id}</span></div>
        <div class="order-row"><span>Items</span><span>${o.items.length} item${o.items.length !== 1 ? 's':''}</span></div>
        <div class="order-row"><span>Total Paid</span><span style="font-weight:700;color:var(--success)">₹${o.totalAmount.toFixed(2)}</span></div>
        <div class="order-row"><span>Status</span><span class="status-badge status-${o.status}">${o.status}</span></div>
        <div class="order-row"><span>Ship to</span><span>${o.shippingAddress.city}, ${o.shippingAddress.country}</span></div>
      `;
    }
    loadOrder();
  </script>
</body>
</html>

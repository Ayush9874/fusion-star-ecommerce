<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fusion Star — Premium E-Commerce</title>
  <meta name="description" content="Discover premium products at unbeatable prices. Shop electronics, clothing, beauty, and more." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-logo">✦ Fusion Star</a>
      <div class="nav-links">
        <a href="/" class="nav-link active">Shop</a>
        <a href="/orders.html" class="nav-link" id="nav-orders">My Orders</a>
        <a href="/admin/" class="nav-link" id="nav-admin" style="display:none">Admin</a>
      </div>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" id="cart-btn">
          🛒 Cart <span class="cart-count" id="cart-count" style="display:none">0</span>
        </a>
        <div id="nav-auth-area"></div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>Shop the <span class="gradient-text">Future</span><br>of Retail</h1>
      <p>Discover premium products curated for modern living. From cutting-edge electronics to timeless fashion.</p>
      <div class="hero-actions">
        <a href="#products" class="btn btn-primary btn-lg">Explore Products</a>
        <a href="#featured" class="btn btn-ghost btn-lg">View Featured</a>
      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section class="section" id="products">
    <div class="container">
      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search products..." />
        </div>
        <select class="select-input" id="category-filter">
          <option value="">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Books">Books</option>
          <option value="Home & Kitchen">Home &amp; Kitchen</option>
          <option value="Sports">Sports</option>
          <option value="Beauty">Beauty</option>
          <option value="Toys">Toys</option>
          <option value="Jewelry">Jewelry</option>
          <option value="Other">Other</option>
        </select>
        <select class="select-input" id="sort-filter">
          <option value="-createdAt">Newest</option>
          <option value="price">Price: Low → High</option>
          <option value="-price">Price: High → Low</option>
          <option value="-rating">Top Rated</option>
        </select>
        <select class="select-input" id="price-filter">
          <option value="">Any Price</option>
          <option value="0-50">Under $50</option>
          <option value="50-100">$50 – $100</option>
          <option value="100-250">$100 – $250</option>
          <option value="250-99999">$250+</option>
        </select>
      </div>

      <!-- Grid -->
      <div id="products-container">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 <strong>Fusion Star</strong>. Built with ❤️ | <a href="/admin/">Admin Panel</a></p>
    </div>
  </footer>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
